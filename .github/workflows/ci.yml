name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: emissions
          POSTGRES_PASSWORD: emissions
          POSTGRES_DB: emissions
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U emissions"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATA_MODE: fixture
      DATABASE_URL: postgresql+psycopg://emissions:emissions@localhost:5432/emissions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m pytest

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
