# Single source of truth for region, thresholds, schedule and weights.
# Secrets and per-machine values live in .env (see .env.example).
# Values marked "placeholder" are tuned in the phase that uses them.

region:
  name: singrauli
  # [min_lon, min_lat, max_lon, max_lat], WGS84
  bbox: [82.30, 23.85, 82.95, 24.45]
  geojson: config/regions/singrauli.geojson
  metric_crs: EPSG:32644
  timezone: Asia/Kolkata

data:
  cache_dir: data/cache
  fixtures_dir: tests/fixtures
  max_aoi_km: 60

registry:                      # Phase 3 (#16)
  dedupe_radius_km: 3.0
  name_weight: 0.6
  distance_weight: 0.4
  merge_threshold: 0.75        # placeholder
  coordinate_priority: [gem, gppd, climate_trace, osm]
  footprint_search_m: 500

detect:
  no2:                         # Phase 4 (#1)
    buffer_km: 5
    annulus_inner_km: 20
    annulus_outer_km: 50
    z_threshold: 2.0
    min_valid_fraction: 0.5
    max_cloud_fraction: 0.3
    footprint_sigma: 2.0
  so2:                         # Phase 4 (#2)
    window_days: 28
    z_threshold: 2.0
    min_valid_fraction: 0.5
  ch4:                         # Phase 4 (#3)
    baseline_months: 12
  flaring:                     # Phase 4 (#5)
    min_temperature_k: 1400
    max_distance_km: 2.0
    min_nights: 3
    window_nights: 30
  thermal:                     # Phase 6 (#7)
    model_path: models/thermal_lgbm.txt
    features_path: models/thermal_features.json
  smoke:                       # Phase 7 (#8)
    model_path: models/smoke_resnet18.onnx
    chip_size_px: 128
    max_cloud_pct: 20
    stub_probability: 0.5
  confidence:                  # Phase 4 (#21)
    weights:
      qa: 0.25
      cloud: 0.2
      wind: 0.2
      overpasses: 0.15
      z_margin: 0.2
    wind_min_ms: 1.5
    wind_max_ms: 10.0

attribute:
  cone:                        # Phase 5 (#17)
    half_angle_deg: 30
    travel_hours: 3
    max_length_km: 50
    overpass_local_time: "13:30"
  fusion:                      # Phase 5
    window_hours: 48
    max_confidence: 0.99
    crop_burning_radius_km: 10
    crop_burning_window_hours: 24
  emission:                    # Phase 5 (#18)
    wind_min_ms: 2.0
    wind_max_ms: 8.0
    across_wind_km: 20
    no2_to_nox: 1.32
    bootstrap_n: 200
    band_percentiles: [5, 95]

temporal:                      # Phase 8 (#22, #23)
  baseline_model_path: models/baseline_lgbm.txt
  start_date: "2018-05-01"
  residual_window_days: 60
  anomaly_z: 3.0
  anomaly_min_days: 2
  anomaly_lookback_days: 5
  known_events_csv: data/known_events.csv

impact:                        # Phase 9 (#28, #29)
  wedge_half_angle_deg: 20
  travel_hours: 3
  max_length_km: 40
  nearest_sites: 10

alerts:                        # Phase 12 (#33)
  from_address: alerts@emissions-monitor.local
  base_url: http://localhost:8000

schedule:                      # Phase 10, times in region timezone
  daily_pipeline: "15:00"
  reprocess_days: 5
  firms_every_hours: 3
  nightfire_daily: "09:00"
  emission_rates_weekday: mon
  baseline_retrain_day: 1
  heartbeat_minutes: 10
